# Postgres for local dbscope demo only. Do not use these credentials in production.
# 1. Run: ./scripts/create-dummy-data.sh
# 2. Run: docker compose up -d
# 3. Run: ./target/release/dbscope analyze --schema 'postgres://dbscope:dbscope@localhost:5433/dbscope'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dbscope
      POSTGRES_PASSWORD: dbscope
      POSTGRES_DB: dbscope
    ports:
      - "5433:5432"
    volumes:
      - ./dummy-data:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbscope -d dbscope"]
      interval: 2s
      timeout: 2s
      retries: 10
